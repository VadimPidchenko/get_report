name: Build Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: | 
          docker build \
          -t ghcr.io/vadimpidchenko/get_report:latest \
          -t ghcr.io/vadimpidchenko/get_report:sha-$SHORT_SHA \
          .

      - name: Push Docker image
        run: |
          docker push ghcr.io/vadimpidchenko/get_report:latest
          docker push ghcr.io/vadimpidchenko/get_report:sha-$SHORT_SHA

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: get_report
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}