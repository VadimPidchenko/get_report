name: User Kit Release

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "compose.yaml"
      - ".github/workflows/user-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare user kit
        run: |
          mkdir -p dist/get_report/{drafts,images,reports}
          cp README.md compose.yaml dist/get_report/

      - name: Create user kit archive
        run: |
          cd dist/get_report
          zip -r ../get_report.zip README.md compose.yaml drafts images reports
          unzip -l ../get_report.zip

      - name: Publish user kit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: user-kit
          ASSET_PATH: dist/get_report.zip

        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber

            gh release edit "$RELEASE_TAG" \
              --title "Get Report — пользовательский комплект" \
              --notes "Пользовательский комплект для запуска Get Report через Docker Compose. Скачайте файл get_report.zip из раздела Assets." \
              --latest
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --target "$GITHUB_SHA" \
              --title "Get Report — пользовательский комплект" \
              --notes "Пользовательский комплект для запуска Get Report через Docker Compose. Скачайте файл get_report.zip из раздела Assets." \
              --latest
          fi
